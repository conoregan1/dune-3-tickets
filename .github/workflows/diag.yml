name: Diagnose ODEON access

on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ODEON from a GitHub runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"
          for u in https://www.odeon.co.uk/cinemas/bristol/ https://www.odeon.co.uk/ https://www.odeon.co.uk/robots.txt https://www.odeon.co.uk/films/; do
            echo "== $u"
            curl -sS -L -c jar -b jar -o body.html -D headers.txt -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: en-GB,en;q=0.9" "$u" || true
            grep -iE "^HTTP|^server|^cf-|^location" headers.txt || true
            echo "token in page: $(grep -c authToken body.html || true)"
            head -c 300 body.html | tr '\n' ' '; echo; echo
          done
          echo "== API, deliberately bad token (401 = reachable, 403 from Cloudflare = blocked)"
          for p in sites "showtimes/by-business-date/2026-12-18?siteIds=315"; do
            curl -sS -o api.json -D api-headers.txt -w "$p -> %{http_code} %{size_download}\n" \
              -H "Authorization: Bearer x.y.z" -H "Accept: application/json" -A "$UA" \
              "https://vwc.odeon.co.uk/WSVistaWebClient/ocapi/v1/$p" || true
            grep -iE "^HTTP|^server|^cf-" api-headers.txt || true
            head -c 200 api.json; echo
          done
